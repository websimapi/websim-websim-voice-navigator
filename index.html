<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSim Voice Navigator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
        }

        #main-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #iframe-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        #websim-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        #voice-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        #voice-indicator.active {
            opacity: 1;
        }

        #voice-indicator.listening {
            background: rgba(0, 136, 255, 0.1);
            border-color: rgba(0, 136, 255, 0.3);
            color: #0088ff;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 18px;
        }

        #permissions-prompt {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        #permissions-content {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        #permissions-content h2 {
            margin-bottom: 20px;
            color: #fff;
            font-size: 24px;
        }

        #permissions-content p {
            color: #ccc;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        #permissions-content button {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        #permissions-content button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
        }

        #permissions-content button:active {
            transform: translateY(0);
        }

        .hidden {
            display: none !important;
        }

        #status-dot {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #666;
            transition: all 0.3s ease;
        }

        #status-dot.listening {
            background: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        #status-dot.speaking {
            background: #0088ff;
            box-shadow: 0 0 10px rgba(0, 136, 255, 0.5);
        }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="iframe-container">
            <div id="loading">Loading WebSim...</div>
            <iframe id="websim-frame" src="" seamless></iframe>
        </div>
        
        <div id="voice-indicator">
            Voice control ready
        </div>
        
        <div id="status-dot"></div>

        <div id="permissions-prompt">
            <div id="permissions-content">
                <h2>Voice Navigation Ready</h2>
                <p>Allow microphone access to control WebSim hands-free with voice commands like "WebSim next" or "WebSim skip"</p>
                <button onclick="voiceNav.requestPermissions()">Enable Voice Control</button>
            </div>
        </div>
    </div>

    <script type="module" src="voice-navigator.js"></script>

</body>
</html>
